name: Keep Supabase awake

# Supabase pauses a free project after about a week with no activity. This makes a tiny
# read against the database every few days so it never goes to sleep, whether or not
# anyone has opened the site. The row-level security rules reject the request without the
# access code, so it reads nothing — the point is only that the database gets touched.

on:
  schedule:
    - cron: "17 6 */3 * *"   # every three days, 06:17 UTC
  workflow_dispatch:          # and on demand from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Touch the database
        env:
          URL: https://flydjimniwbupdlisknf.supabase.co
          KEY: sb_publishable_h9MKVS8dh5qEDv9oNrg4Tw_QVFsOiix
        run: |
          status=$(curl -sS -o /tmp/body -w '%{http_code}' \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/plans?select=id&limit=1")
          echo "HTTP $status"
          head -c 200 /tmp/body; echo
          if [ "$status" != "200" ]; then
            echo "::error::Supabase did not answer with 200 — the project may be paused or the key may have changed."
            exit 1
          fi
          echo "Database is awake."
