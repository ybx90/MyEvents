name: Keep Supabase awake

# Supabase pauses a free project that does not get "sufficient user database activity"
# over the past week, and their docs put the bar at "a few user requests to the database
# each day". An earlier version of this ran once every three days — about a third of a
# request per day — which is well under that bar: every run succeeded and the project was
# paused anyway on 23 November 2026.
#
# So this now runs every six hours and makes three requests each time, roughly a dozen a
# day. Two of them deliberately execute real queries:
#
#   - the plans read goes through row-level security, which rejects it without the access
#     code header, so it returns an empty list — Postgres still runs the query;
#   - check_code() is SECURITY DEFINER, so it runs a real lookup and returns a value even
#     without the access code. It is called with a deliberately wrong code.
#
# The job fails loudly on anything but HTTP 200, which is how you find out the project has
# been paused again rather than discovering it from an email a week later. While a project
# IS paused, expect a failure notification every six hours until it is resumed.

on:
  schedule:
    - cron: "17 */6 * * *"   # 00:17, 06:17, 12:17, 18:17 UTC
  workflow_dispatch:          # and on demand from the Actions tab

permissions:
  contents: read

# A run already in flight is enough; never queue them up behind each other.
concurrency:
  group: keep-supabase-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Touch the database
        env:
          # Publishable (anon) key: safe in public — access is gated by row-level
          # security, which needs the x-passcode header this workflow never sends.
          URL: https://flydjimniwbupdlisknf.supabase.co
          KEY: sb_publishable_h9MKVS8dh5qEDv9oNrg4Tw_QVFsOiix
        run: |
          set -u
          fail=0

          request() {
            local label="$1"; shift
            local status
            status=$(curl -sS --max-time 30 -o /tmp/body -w '%{http_code}' "$@") || status="000"
            echo "$label: HTTP $status"
            head -c 200 /tmp/body; echo
            if [ "$status" != "200" ]; then
              echo "::error::$label returned $status — the project may be paused, or the key may have changed."
              fail=1
            fi
          }

          request "read plans" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/plans?select=id&limit=1"

          request "count plans" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Prefer: count=exact" \
            "$URL/rest/v1/plans?select=id&limit=1"

          # Runs a real lookup regardless of row-level security. The code is wrong on
          # purpose; all we want is for Postgres to do some work.
          request "check_code" \
            -X POST \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            --data '{"code":"keepalive-not-a-real-code"}' \
            "$URL/rest/v1/rpc/check_code"

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "Database is awake."
